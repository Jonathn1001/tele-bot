services:
  - type: worker
    name: telegram-intel-bot
    runtime: docker
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNELS
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: BUFFER_SIZE
        value: "100"
      - key: MAX_CONTEXT_MESSAGES
        value: "50"
