name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  # CD: push to main -> SSH to the GCP VM -> sync repo -> build image on the VM -> restart.
  # No registry: the e2-micro builds the image itself (2GB swap on the VM makes this viable).
  # Skipped until the DEPLOY_ENABLED repo variable is "true" (Settings -> Variables),
  # so CI stays green while secrets are not yet configured.
  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Build and restart on GCP VM over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "elgnas@$HOST" \
            "cd ~/telegram-intel-bot && git fetch origin && git reset --hard origin/main && sudo docker compose build bot && sudo docker compose up -d && sudo docker image prune -f"
